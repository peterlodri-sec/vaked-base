<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>vaked · sentinel console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<style>
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d1117;color:#e2e8f0;font-family:ui-monospace,'JetBrains Mono',monospace;z-index:50}
  #boot .bw{font-family:'Space Grotesk',system-ui,sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.03em;color:#e2e8f0}
  #boot .bs{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#818cf8}
  #boot .bbar{width:190px;height:2px;background:#1f2937;border-radius:2px;overflow:hidden}
  #boot .bbar i{display:block;height:100%;width:42%;background:#6366f1;border-radius:2px;animation:bootslide 1.05s ease-in-out infinite}
  #boot .bd{font-size:11.5px;color:#6b7280;letter-spacing:0.02em}
  @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
</style>

<!-- Vaked design-system tokens + fonts (entry point @imports the token files) -->
<link rel="stylesheet" href="_ds/styles.css">

<!-- console chrome -->
<link rel="stylesheet" href="console.css">
</head>
<body>


  <div id="root"><div id="boot"><div class="bw">vaked</div><div class="bs">sentinel console</div><div class="bbar"><i></i></div><div class="bd">initializing swarm · bare-metal vakefield…</div></div></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Vaked component bundle (plain JS) -->

  <!-- engine (plain JS → window.VakedConsole) -->
  <script src="engine.js"></script>

  <!-- React UI (babel) -->
  <script type="text/babel" src="ui.jsx"></script>
